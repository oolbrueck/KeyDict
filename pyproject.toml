[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "keydict"
version = "0.1.0"
description = "Configurable push-to-talk and toggle dictation for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "evdev>=1.7,<2",
    "pynput>=1.7.7,<2",
    "requests>=2.31,<3",
    "sounddevice>=0.4.6,<1",
]

[project.scripts]
keydict = "keydict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keydict = ["config.example.toml"]
